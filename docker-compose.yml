version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# i-love-shopping observability stack
#
#   Containers
#     prometheus — metrics storage/scraper (scrapes the API's management port)
#     loki       — log storage (container logs shipped by alloy)
#     alloy      — log collector (reads container logs via the docker socket)
#     grafana    — dashboards + unified alerting, emails alerts via MailHog
#
#   The stack JOINS the platform network (docker_iloveshopping-network is the
#   world's project name when the platform runs from docker/). Start the
#   platform first (start.sh or docker-compose.yml), then this one.
# ─────────────────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: iloveshopping-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9190}:9090"   # host view (Grafana is the UI)
    networks:
      - platform

  loki:
    image: grafana/loki:latest
    container_name: iloveshopping-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - platform

  alloy:
    image: grafana/alloy:latest
    container_name: iloveshopping-alloy
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform

  grafana:
    image: grafana/grafana:latest
    container_name: iloveshopping-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # alert channels land in MailHog (part of the platform stack)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "iloveshopping-mailhog:1025"
      GF_SMTP_FROM_ADDRESS: "alerts@iloveshopping.local"
      GF_SMTP_FROM_NAME: "i-love-shopping alerts"
      GF_SMTP_SKIP_VERIFY: "true"
      GF_SMTP_EHLO_IDENTITY: "grafana.iloveshopping.local"
      # datasource provisioning picks secrets from env so this file is safe
      POSTGRES_USER: "${POSTGRES_USER:-iloveshopping}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-iloveshopping}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - platform
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  platform:
    external: true
    name: docker_iloveshopping-network
