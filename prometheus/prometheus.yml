# Prometheus — i-love-shopping observability
#
# Two scrape targets: the containerized API (`api:9090`) and — when the
# developer runs the API locally with MANAGEMENT_PORT — the host loopback
# path. One might be down; that's fine.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: i-love-shopping

rule_files:
  - "/etc/prometheus/rules.yml"

scrape_configs:
  - job_name: iloveshopping-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:9090", "host.docker.internal:9090"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance_kind
        regex: "api:9090"
        replacement: "container"
      - source_labels: [__address__]
        target_label: instance_kind
        regex: "host.docker.internal:9090"
        replacement: "host"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
