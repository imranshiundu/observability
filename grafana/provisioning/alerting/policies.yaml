apiVersion: 1

# Notification policies — tuned against alert fatigue:
#  group_wait keeps one burst from sending five emails,
#  repeat_interval is hours, not minutes, and normal resolution emails fire.
policies:
  - orgId: 1
    receiver: mail-alerts
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
